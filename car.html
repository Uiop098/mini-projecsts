<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Road Rush - Car Game</title>
  <link rel="stylesheet" href="car.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="400" height="640"></canvas>

    <div id="hud">
      <span>Score: <b id="score">0</b></span>
      <span>Best: <b id="best">0</b></span>
      <span>Speed: <b id="speed">0</b> km/h</span>
    </div>

    <div id="overlay">
      <h1 id="title">Road Rush</h1>
      <p id="msg">Dodge the traffic. Go as far as you can.</p>
      <button id="startBtn">Start</button>
      <p class="hint">Move: ← → or A / D &nbsp;|&nbsp; Pause: P</p>
    </div>

    <div id="touch">
      <button id="leftBtn" aria-label="Left">◀</button>
      <button id="rightBtn" aria-label="Right">▶</button>
    </div>
  </div>
  <script src="car.js"></script>
</body>
</html>
